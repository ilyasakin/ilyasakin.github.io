name: CI
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:bpmn:import
      - run: bun run check
      - name: Select installed sandbox-capable Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome)"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          readlink -f "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Verify BPMN in served production build
        run: bun run test:bpmn:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-bpmn-browser-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
